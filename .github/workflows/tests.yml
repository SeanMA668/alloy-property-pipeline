name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: "pip install --only-binary=:all: -r requirements.txt"
      - name: Run tests (no Thermo-Calc or API key needed)
        run: pytest -q
